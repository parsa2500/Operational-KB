<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operational-KB Chat</title>
  <style>
    :root{font-family:Vazirmatn,Segoe UI,Tahoma,sans-serif;color:#e8edf5;background:#0d1117}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#172554 0,#0d1117 42%)}main{max-width:980px;margin:auto;padding:28px 18px;display:flex;flex-direction:column;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand h1{font-size:22px;margin:0 0 6px}.brand p{color:#94a3b8;margin:0;font-size:13px}.status{font-size:12px;color:#86efac;border:1px solid #14532d;background:#052e16;padding:7px 10px;border-radius:999px}.chat{flex:1;border:1px solid #263244;background:#111827cc;border-radius:18px;padding:18px;box-shadow:0 20px 70px #0004;overflow:auto}.empty{text-align:center;color:#94a3b8;padding:18vh 20px}.empty strong{display:block;color:#e8edf5;font-size:18px;margin-bottom:10px}.msg{display:flex;margin:14px 0}.msg.user{justify-content:flex-start}.msg.assistant{justify-content:flex-end}.bubble{max-width:82%;padding:13px 15px;border-radius:15px;line-height:1.8;white-space:pre-wrap}.user .bubble{background:#1d4ed8;color:#fff;border-bottom-left-radius:4px}.assistant .bubble{background:#1f2937;border:1px solid #334155;border-bottom-right-radius:4px}.meta{font-size:11px;color:#94a3b8;margin-top:10px}.citations{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.citation{font-size:11px;color:#bfdbfe;background:#172554;border:1px solid #1e40af;border-radius:7px;padding:4px 7px}.composer{display:flex;gap:10px;margin-top:14px}.composer textarea{flex:1;resize:none;min-height:56px;max-height:160px;border:1px solid #334155;border-radius:13px;background:#111827;color:#fff;padding:12px;font:inherit;outline:none}.composer textarea:focus{border-color:#60a5fa}.composer button{border:0;border-radius:13px;background:#2563eb;color:#fff;padding:0 20px;font:inherit;cursor:pointer}.composer button:disabled{opacity:.5;cursor:wait}.examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.example{background:#111827;color:#cbd5e1;border:1px solid #334155;border-radius:999px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px}.unknown{color:#fbbf24}.error{color:#fca5a5}
  </style>
</head>
<body>
<main>
  <header class="top"><div class="brand"><h1>Operational-KB</h1><p>پاسخ مستند از روی کد و مستندات پروژه</p></div><div id="status" class="status">در حال اتصال...</div></header>
  <section id="chat" class="chat"><div class="empty"><strong>سؤال عملیاتی پروژه‌ات را بپرس</strong><span>هر مرحله فقط وقتی نمایش داده می‌شود که در evidence پروژه پیدا شده باشد.</span><div class="examples"><button class="example">پرداخت آفلاین را از کجا ببینم و تأیید کنم؟</button><button class="example">مسیر ورود کاربران چیست؟</button><button class="example">این قابلیت از کدام API استفاده می‌کند؟</button></div></div></section>
  <form id="form" class="composer"><textarea id="question" placeholder="مثلاً: مشتری پرداخت آفلاین انجام داده، از کجا فیش را ببینم و تأیید کنم؟" required></textarea><button id="send" type="submit">ارسال</button></form>
</main>
<script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#question'),send=document.querySelector('#send'),status=document.querySelector('#status');
function add(role,text,data){const wrap=document.createElement('div');wrap.className='msg '+role;const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text; if(data?.unknown) bubble.classList.add('unknown'); if(data?.citations?.length){const cites=document.createElement('div');cites.className='citations';data.citations.forEach(c=>{const el=document.createElement('span');el.className='citation';el.textContent=`${c.path}:${c.lineStart}-${c.lineEnd} · ${c.kind}`;cites.appendChild(el)});bubble.appendChild(cites)} wrap.appendChild(bubble);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight}
async function health(){try{const r=await fetch('/health/ready');status.textContent=r.ok?'متصل':'دیتابیس آماده نیست';status.style.color=r.ok?'#86efac':'#fbbf24'}catch{status.textContent='API در دسترس نیست';status.style.color='#fca5a5'}}
form.addEventListener('submit',async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;const empty=chat.querySelector('.empty');if(empty)empty.remove();add('user',q);input.value='';send.disabled=true;send.textContent='در حال جست‌وجو...';try{const r=await fetch('/api/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q})});const data=await r.json();if(!r.ok)throw new Error(data.error?.formErrors?.join(', ')||'خطا در پاسخ');add('assistant',data.answer||'Evidence پیدا شد، اما LLM برای تولید پاسخ فعال نیست. منابع بازیابی‌شده را بررسی کن.',data)}catch(err){add('assistant','خطا: '+err.message,{unknown:true})}finally{send.disabled=false;send.textContent='ارسال'}});
document.querySelectorAll('.example').forEach(b=>b.addEventListener('click',()=>{input.value=b.textContent;input.focus()}));health();
</script>
</body>
</html>
