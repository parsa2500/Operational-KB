<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operational-KB</title>
<style>
:root{font-family:Tahoma,"Segoe UI",sans-serif;color:#e8edf5;background:#080d17}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#172554 0,#080d17 44%)}main{max-width:1000px;min-height:100vh;margin:auto;padding:24px 16px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.brand h1{font-size:22px;margin:0 0 5px}.brand p,.muted{color:#94a3b8;margin:0;font-size:12px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:11px;padding:6px 9px;border:1px solid #334155;background:#111827;border-radius:999px}.ok{color:#86efac;border-color:#166534}.warn{color:#fbbf24;border-color:#854d0e}.chat{flex:1;border:1px solid #263244;background:#111827d9;border-radius:18px;padding:18px;box-shadow:0 20px 70px #0005;overflow:auto;min-height:55vh}.empty{text-align:center;color:#94a3b8;padding:15vh 20px}.empty strong{display:block;color:#e8edf5;font-size:19px;margin-bottom:9px}.msg{display:flex;margin:14px 0}.msg.user{justify-content:flex-start}.msg.assistant{justify-content:flex-end}.bubble{max-width:84%;padding:13px 15px;border-radius:15px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#1d4ed8;color:#fff;border-bottom-left-radius:4px}.assistant .bubble{background:#1f2937;border:1px solid #334155;border-bottom-right-radius:4px}.citations{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:10px;border-top:1px solid #334155}.citation{font-size:11px;color:#bfdbfe;background:#172554;border:1px solid #1e40af;border-radius:7px;padding:4px 7px;direction:ltr}.composer{display:flex;gap:10px;margin-top:13px}.composer textarea{flex:1;resize:none;min-height:58px;max-height:160px;border:1px solid #334155;border-radius:13px;background:#111827;color:#fff;padding:12px;font:inherit;outline:none}.composer textarea:focus{border-color:#60a5fa}.composer button{border:0;border-radius:13px;background:#2563eb;color:#fff;padding:0 22px;font:inherit;cursor:pointer}.composer button:disabled{opacity:.5}.examples{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}.example{background:#111827;color:#cbd5e1;border:1px solid #334155;border-radius:999px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px}.unknown{color:#fbbf24}.details{font-size:11px;color:#94a3b8;margin-top:8px}@media(max-width:640px){.top{align-items:flex-start;flex-direction:column}.bubble{max-width:94%}.composer button{padding:0 14px}}
</style>
</head>
<body><main>
<header class="top"><div class="brand"><h1>Operational-KB</h1><p>دستیار عملیاتی مستند به کد پروژه</p></div><div class="badges"><span id="api" class="badge">API...</span><span id="index" class="badge">Index...</span><span id="llm" class="badge">LLM...</span></div></header>
<section id="chat" class="chat"><div class="empty"><strong>از نرم‌افزارت سؤال بپرس</strong><span>مسیرهای UI، دسترسی‌ها، APIها و نتیجه عملیات فقط با مدرک پاسخ داده می‌شوند.</span><div class="examples"><button class="example" type="button">پرداخت آفلاین را از کجا ببینم و تأیید کنم؟</button><button class="example" type="button">مسیر ورود کاربران چیست؟</button><button class="example" type="button">این صفحه از کدام API استفاده می‌کند؟</button></div></div></section>
<form id="form" class="composer"><textarea id="question" placeholder="مثلاً: مشتری پرداخت آفلاین کرده، چطور فیش را بررسی و تأیید کنم؟" required></textarea><button id="send" type="submit">ارسال</button></form>
</main><script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#question'),send=document.querySelector('#send');const history=[];
function badge(id,text,state){const el=document.querySelector('#'+id);el.textContent=text;el.className='badge '+state}
function add(role,text,data={}){const wrap=document.createElement('div');wrap.className='msg '+role;const bubble=document.createElement('div');bubble.className='bubble'+(data.unknown?' unknown':'');bubble.textContent=text;if(data.citations?.length){const cites=document.createElement('div');cites.className='citations';data.citations.forEach(c=>{const el=document.createElement('span');el.className='citation';el.textContent=`${c.path}:${c.lineStart}-${c.lineEnd} · ${c.kind}`;cites.appendChild(el)});bubble.appendChild(cites)}if(data.mode){const meta=document.createElement('div');meta.className='details';meta.textContent=data.mode==='evidence-only'?'حالت Evidence-only: برای پاسخ طبیعی LLM را تنظیم کن.':`mode: ${data.mode}`;bubble.appendChild(meta)}wrap.appendChild(bubble);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight}
async function status(){try{const health=await fetch('/health/ready');badge('api',health.ok?'API متصل':'DB آماده نیست',health.ok?'ok':'warn');const r=await fetch('/api/status'),s=await r.json();badge('index',s.revision?`${s.evidenceTotal} مدرک`:'پروژه ingest نشده',s.revision?'ok':'warn');badge('llm',s.llmConfigured?'LLM فعال':'Evidence-only',s.llmConfigured?'ok':'warn')}catch{badge('api','API قطع','warn')}}
form.addEventListener('submit',async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;chat.querySelector('.empty')?.remove();add('user',q);input.value='';send.disabled=true;send.textContent='در حال بررسی...';try{const r=await fetch('/api/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,history:history.slice(-6)})});const data=await r.json();if(!r.ok)throw new Error(data.error||'خطا در پاسخ');const text=data.answer||'مدارک مرتبط پیدا شد، اما LLM تنظیم نشده است.';add('assistant',text,data);history.push({role:'user',content:q},{role:'assistant',content:text})}catch(err){add('assistant','خطا: '+(typeof err.message==='string'?err.message:'درخواست ناموفق بود'),{unknown:true})}finally{send.disabled=false;send.textContent='ارسال';input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll('.example').forEach(b=>b.addEventListener('click',()=>{input.value=b.textContent;input.focus()}));status();
</script></body></html>
