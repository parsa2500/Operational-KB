<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operational-KB</title><style>
:root{font-family:Tahoma,"Segoe UI",sans-serif;color:#e8edf5;background:#080d17}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#172554 0,#080d17 44%)}main{max-width:1050px;min-height:100vh;margin:auto;padding:22px 16px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:12px}.brand h1{font-size:22px;margin:0 0 5px}.brand p,.muted{color:#94a3b8;margin:0;font-size:12px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.button{font:inherit;border:1px solid #334155;border-radius:10px;padding:8px 11px;cursor:pointer;background:#111827;color:#cbd5e1;font-size:12px}.button.primary{background:#2563eb;color:#fff;border-color:#2563eb}.button:hover{filter:brightness(1.15)}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.badge{font-size:11px;padding:6px 9px;border:1px solid #334155;background:#111827;border-radius:999px}.ok{color:#86efac;border-color:#166534}.warn{color:#fbbf24;border-color:#854d0e}.layout{display:flex;gap:12px;flex:1;min-height:0}.chat{flex:1;border:1px solid #263244;background:#111827d9;border-radius:18px;padding:18px;box-shadow:0 20px 70px #0005;overflow:auto;min-height:58vh}.empty{text-align:center;color:#94a3b8;padding:15vh 20px}.empty strong{display:block;color:#e8edf5;font-size:19px;margin-bottom:9px}.msg{display:flex;margin:14px 0}.msg.user{justify-content:flex-start}.msg.assistant{justify-content:flex-end}.bubble{max-width:84%;padding:13px 15px;border-radius:15px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#1d4ed8;color:#fff;border-bottom-left-radius:4px}.assistant .bubble{background:#1f2937;border:1px solid #334155;border-bottom-right-radius:4px}.citations{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:10px;border-top:1px solid #334155}.citation{font-size:11px;color:#bfdbfe;background:#172554;border:1px solid #1e40af;border-radius:7px;padding:4px 7px;direction:ltr}.details{font-size:11px;color:#94a3b8;margin-top:8px}.composer{display:flex;gap:10px;margin-top:13px}.composer textarea{flex:1;resize:none;min-height:58px;max-height:160px;border:1px solid #334155;border-radius:13px;background:#111827;color:#fff;padding:12px;font:inherit;outline:none}.composer textarea:focus{border-color:#60a5fa}.composer button{border:0;border-radius:13px;background:#2563eb;color:#fff;padding:0 22px;font:inherit;cursor:pointer}.composer button:disabled{opacity:.5}.examples{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}.example{background:#111827;color:#cbd5e1;border:1px solid #334155;border-radius:999px;padding:7px 10px;cursor:pointer;font:inherit;font-size:12px}.unknown{color:#fbbf24}.settings{width:260px;border:1px solid #263244;background:#0f172acc;border-radius:18px;padding:15px;height:max-content}.settings h2{font-size:15px;margin:0 0 12px}.setting{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #1e293b;padding:9px 0;font-size:11px}.setting span:first-child{color:#94a3b8}.setting span:last-child{text-align:left;color:#e2e8f0;max-width:145px;overflow-wrap:anywhere}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.layout{display:block}.settings{width:auto;margin-top:12px}.bubble{max-width:94%}}
</style></head><body><main>
<header class="top"><div class="brand"><h1>Operational-KB</h1><p id="agentSubtitle">دستیار عملیاتی مستند به کد پروژه</p></div><div class="actions"><button id="newChat" class="button primary" type="button">+ چت جدید</button><button id="toggleSettings" class="button" type="button">تنظیمات</button></div></header>
<div class="badges"><span id="api" class="badge">API...</span><span id="index" class="badge">Index...</span><span id="llm" class="badge">LLM...</span></div>
<div class="layout"><section id="chat" class="chat"><div class="empty"><strong>از نرم‌افزارت سؤال بپرس</strong><span>مسیرهای سامانه فقط وقتی قطعی گفته می‌شوند که در کد یا مستندات مدرک داشته باشند.</span><div class="examples"><button class="example" type="button">پرداخت آفلاین را از کجا ببینم و تأیید کنم؟</button><button class="example" type="button">مسیر ورود کاربران چیست؟</button><button class="example" type="button">این صفحه از کدام API استفاده می‌کند؟</button></div></div></section><aside id="settings" class="settings" hidden><h2>تنظیمات دستیار</h2><div id="settingsBody" class="muted">در حال بارگذاری...</div></aside></div>
<form id="form" class="composer"><textarea id="question" placeholder="مثلاً: مشتری پرداخت آفلاین کرده، چطور فیش را بررسی و تأیید کنم؟" required></textarea><button id="send" type="submit">ارسال</button></form>
</main><script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#question'),send=document.querySelector('#send'),history=[];let agentConfig={};
function badge(id,text,state){const el=document.querySelector('#'+id);el.textContent=text;el.className='badge '+state}
function add(role,text,data={}){const wrap=document.createElement('div');wrap.className='msg '+role;const bubble=document.createElement('div');bubble.className='bubble'+(data.unknown?' unknown':'');bubble.textContent=text;if(data.citations?.length){const cites=document.createElement('div');cites.className='citations';data.citations.forEach(c=>{const el=document.createElement('span');el.className='citation';el.textContent=`${c.path}:${c.lineStart}-${c.lineEnd} · ${c.kind}`;cites.appendChild(el)});bubble.appendChild(cites)}if(data.mode){const meta=document.createElement('div');meta.className='details';meta.textContent=data.mode==='evidence-only'?'حالت مدرک‌محور: برای پاسخ طبیعی، LLM را تنظیم کن.':`حالت پاسخ: ${data.mode}`;bubble.appendChild(meta)}wrap.appendChild(bubble);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight}
function newChat(){history.length=0;chat.innerHTML='<div class="empty"><strong>چت جدید آماده است</strong><span>سؤال بعدی‌ات را درباره سامانه بپرس.</span></div>';input.value='';input.focus()}
function showSettings(){const body=document.querySelector('#settingsBody');body.innerHTML='';[['نام دستیار',agentConfig.agentName],['لحن',agentConfig.agentTone||'تنظیم‌شده در سرور'],['سقف سؤال',agentConfig.maxQuestionChars+' کاراکتر'],['حافظه مکالمه',agentConfig.maxHistoryMessages+' پیام'],['تعداد مدارک',agentConfig.retrievalLimit],['LLM',agentConfig.llmConfigured?'فعال':'Evidence-only']].forEach(([key,value])=>{const row=document.createElement('div');row.className='setting';const a=document.createElement('span');a.textContent=key;const b=document.createElement('span');b.textContent=value;row.append(a,b);body.appendChild(row)})}
async function status(){try{const health=await fetch('/health/ready');badge('api',health.ok?'API متصل':'DB آماده نیست',health.ok?'ok':'warn');const [r,c]=await Promise.all([fetch('/api/status'),fetch('/api/config')]);const s=await r.json();agentConfig=await c.json();badge('index',s.revision?`${s.evidenceTotal} مدرک`:'پروژه ingest نشده',s.revision?'ok':'warn');badge('llm',s.llmConfigured?'LLM فعال':'Evidence-only',s.llmConfigured?'ok':'warn');document.querySelector('#agentSubtitle').textContent=agentConfig.agentName+' · پاسخ ساده و مستند';showSettings()}catch{badge('api','API قطع','warn')}}
document.querySelector('#newChat').addEventListener('click',newChat);document.querySelector('#toggleSettings').addEventListener('click',()=>{const panel=document.querySelector('#settings');panel.hidden=!panel.hidden});form.addEventListener('submit',async e=>{e.preventDefault();const q=input.value.trim();if(!q)return;chat.querySelector('.empty')?.remove();add('user',q);input.value='';send.disabled=true;send.textContent='در حال تحلیل...';try{const r=await fetch('/api/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,history:history.slice(-agentConfig.maxHistoryMessages)})});const data=await r.json();if(!r.ok)throw new Error(data.error||'خطا در پاسخ');const text=data.answer||'مدرک مرتبط پیدا شد، اما LLM برای ساخت راهنمای ساده فعال نیست.';add('assistant',text,data);history.push({role:'user',content:q},{role:'assistant',content:text})}catch(err){add('assistant','خطا: '+(typeof err.message==='string'?err.message:'درخواست ناموفق بود'),{unknown:true})}finally{send.disabled=false;send.textContent='ارسال';input.focus()}});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll('.example').forEach(b=>b.addEventListener('click',()=>{input.value=b.textContent;input.focus()}));status();
</script></body></html>
